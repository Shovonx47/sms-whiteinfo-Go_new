<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ct_bg" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="ct_avatar" x1="22" y1="16" x2="42" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="ct_badge" x1="40" y1="36" x2="54" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="ct_shadow" x="2" y="4" width="60" height="58" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4338CA" flood-opacity="0.35" />
    </filter>
  </defs>
  <g filter="url(#ct_shadow)">
    <!-- Back Contact Card -->
    <rect x="14" y="8" width="36" height="42" rx="7" fill="#C7D2FE" opacity="0.6" transform="rotate(-6 32 29)" />
    <!-- Front Contact Card -->
    <rect x="12" y="10" width="40" height="46" rx="8" fill="url(#ct_bg)" />
    <!-- Gloss header -->
    <rect x="12" y="10" width="40" height="12" rx="8" fill="#FFFFFF" opacity="0.15" />
    <!-- User Head -->
    <circle cx="32" cy="24" r="7" fill="#FFFFFF" />
    <!-- User Body / Shoulders -->
    <path d="M21 41C21 35.4772 25.4772 32 31 32H33C38.5228 32 43 35.4772 43 41V44H21V41Z" fill="#FFFFFF" />
    <!-- Verified Online Dot Badge -->
    <circle cx="45" cy="45" r="6" fill="#FFFFFF" />
    <circle cx="45" cy="45" r="4.8" fill="url(#ct_badge)" />
    <path d="M43 45L44.5 46.5L47.5 43.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>